<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="signin-body">
  <main class="signin" id="main">
    <p class="product"><a href="index.html">Shajar Ledger</a></p>
    <h1>Open your dashboard</h1>
    <p class="lede">Choose who you are. This is a demo, so there are no passwords: pick any role and name to see that person's dashboard.</p>
    <form id="signin" novalidate>
      <fieldset class="roles-pick">
        <legend>I am</legend>
        <label class="role-card factory"><input type="radio" name="role" value="factory"><b>A factory</b><span>Post how many trees you need, accept farmers' offers, see what you paid.</span></label>
        <label class="role-card farmer"><input type="radio" name="role" value="farmer"><b>A farmer</b><span>Offer your land, ask for planting money, see your earnings.</span></label>
        <label class="role-card investor"><input type="radio" name="role" value="investor"><b>An investor</b><span>Pay for planting and earn a share while the trees live.</span></label>
        <label class="role-card bank"><input type="radio" name="role" value="bank"><b>A bank</b><span>Lend farmers planting money, repaid from factory payments.</span></label>
      </fieldset>
      <div id="who-step"></div>
      <button type="submit" class="btn">Open my dashboard</button>
      <div class="form-msg" id="signin-msg" role="status"></div>
    </form>
    <p class="muted small"><a href="index.html">Back to the overview</a></p>
  </main>
  <script src="logic.js"></script>
  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="ui.js"></script>
  <script src="signin.js"></script>
</body>
</html>
